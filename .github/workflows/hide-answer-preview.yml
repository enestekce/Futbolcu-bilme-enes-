name: Hide answer preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide fallback answer text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.playerNameMini{font-size:19px;font-weight:950}', '.playerNameMini{display:none!important}')
          s = s.replace('<div class="playerNameMini">Görsel yükleniyor...</div>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Hide player name while image loads'
          git push