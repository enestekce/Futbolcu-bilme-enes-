name: Fix player image loading
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index without changing difficulty logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="clubMini">FUTBOLCU BİL</div>','')
          old="img.onerror=()=>{img.style.display='none';fb.style.display='grid'};img.src=p[1];"
          new="""img.onerror=async()=>{
            try{
              img.referrerPolicy='no-referrer';
              const q=encodeURIComponent(p[0]+' footballer');
              const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=0&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*');
              const j=await r.json();
              const pages=Object.values((j.query&&j.query.pages)||{});
              const hit=pages.find(x=>x.thumbnail&&x.thumbnail.source);
              if(hit){img.onload=()=>{fb.style.display='none';img.style.display='block'};img.src=hit.thumbnail.source;return}
            }catch(e){}
            img.style.display='none';fb.style.display='grid';
          };img.referrerPolicy='no-referrer';img.src=p[1];"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix player image loading and hide fallback text'
          git push