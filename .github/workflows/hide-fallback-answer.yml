name: Hide fallback answer text
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/hide-fallback-answer.yml'
permissions:
  contents: write
jobs:
  fix-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all fallback answer text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='\n<style id="no-answer-fallback">.fallbackCard .clubMini,.fallbackCard .playerNameMini{display:none!important}.fallbackCard{gap:0!important}</style>\n'
          if 'id="no-answer-fallback"' not in s:
              s=s.replace(marker, marker+css, 1)
          s=s.replace('<div class="clubMini">FUTBOLCUYU BİL</div>','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: hide fallback answer text [skip ci]' && git push)
